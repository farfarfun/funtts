[build-system]
requires = [ "setuptools>=61.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "funtts-plus"
version = "0.1.20"
description = "统一的文本转语音(TTS)工具库，支持多种开源TTS引擎和字幕格式"
readme = "README.md"
keywords = [ "tts", "text-to-speech", "audio", "subtitle", "speech-synthesis",]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Multimedia :: Sound/Audio :: Speech", "Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.10"
dependencies = [ "funutil>=0.1.0", "pydub>=0.25.0", "ffmpeg-python>=0.2.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.optional-dependencies]
edge = [ "edge-tts>=6.1.0",]
azure = [ "azure-cognitiveservices-speech>=1.30.0",]
bark = [ "bark>=0.1.5", "torch>=1.9.0", "torchaudio>=0.9.0", "scipy>=1.7.0", "soundfile>=0.10.0", "numpy>=1.20.0",]
tortoise = [ "tortoise-tts>=2.4.0", "torch>=1.9.0", "torchaudio>=0.9.0", "soundfile>=0.10.0", "numpy>=1.20.0",]
indextts = [ "indextts; python_version >= '3.10' and python_version < '3.13'",]
kitten = [ "torch>=1.9.0", "torchaudio>=0.9.0", "soundfile>=0.10.0", "numpy>=1.20.0",]
espeak = []
pyttsx3 = [ "pyttsx3>=2.90",]
all = [ "funtts-plus[edge,azure,bark,tortoise,kitten,espeak,pyttsx3]",]

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funtts-plus"
Releases = "https://github.com/farfarfun/funtts-plus/releases"

[tool.setuptools]

[tool.setuptools.packages.find]
where = [ "src",]

[tool.setuptools.package-data]
funtts = ["py.typed"]

[tool.uv.sources.indextts]
git = "https://github.com/index-tts/index-tts.git"

[tool.uv]
conflicts = [
    [{ extra = "tortoise" }, { extra = "indextts" }],
    [{ extra = "all" }, { extra = "indextts" }],
]

[dependency-groups]
dev = [ "pytest>=7.0.0",]
